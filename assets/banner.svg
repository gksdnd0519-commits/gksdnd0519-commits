<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc8f2"/>
      <stop offset="1" stop-color="#d6f0ff"/>
    </linearGradient>
    <style>
      .t { font-family: 'Jua', 'BM JUA', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
      .cloud { animation: drift 28s linear infinite; }
      .cloud2 { animation: drift 40s linear infinite; animation-delay: -14s; }
      @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(1000px); } }
      .bounce { animation: bounce 1.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes bounce { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-14px) rotate(6deg); } }
      .pop { animation: pop 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    </style>
  </defs>

  <rect width="900" height="280" rx="18" fill="url(#sky)"/>

  <!-- 구름 -->
  <g class="cloud" fill="#ffffff" opacity="0.95">
    <ellipse cx="80" cy="60" rx="46" ry="20"/><ellipse cx="110" cy="48" rx="30" ry="22"/><ellipse cx="55" cy="52" rx="22" ry="16"/>
  </g>
  <g class="cloud2" fill="#ffffff" opacity="0.85">
    <ellipse cx="80" cy="110" rx="36" ry="15"/><ellipse cx="102" cy="100" rx="22" ry="16"/>
  </g>

  <!-- 언덕 -->
  <path d="M0 230 C150 185 300 205 450 215 C600 225 750 190 900 210 L900 262 Q900 280 882 280 L18 280 Q0 280 0 262 Z" fill="#7bc67b"/>
  <path d="M0 250 C200 230 400 245 600 240 C750 236 840 228 900 232 L900 262 Q900 280 882 280 L18 280 Q0 280 0 262 Z" fill="#5aad5f"/>

  <!-- 떡잎마을 표지판 -->
  <g transform="translate(70 150)">
    <rect x="44" y="38" width="10" height="60" fill="#8b5a2b"/>
    <rect x="0" y="0" width="100" height="44" rx="6" fill="#c98a4b" stroke="#8b5a2b" stroke-width="3"/>
    <text x="50" y="29" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#4a2c10">떡잎마을</text>
    <!-- 떡잎 -->
    <path d="M50 -2 C40 -22 22 -20 22 -20 C24 -6 38 -2 50 -2 Z" fill="#4caf50"/>
    <path d="M50 -2 C60 -22 78 -20 78 -20 C76 -6 62 -2 50 -2 Z" fill="#66bb6a"/>
  </g>

  <!-- 제목 -->
  <g class="t">
    <text x="450" y="98" text-anchor="middle" font-size="44" font-weight="800" fill="#e53935" stroke="#ffffff" stroke-width="6" paint-order="stroke">gksdnd0519의 떡잎마을</text>
    <text x="450" y="140" text-anchor="middle" font-size="20" fill="#1e3a5f">짱구처럼 엉뚱하게, 짱아처럼 무럭무럭 코딩하는 중</text>
  </g>

  <!-- 빨강·노랑 줄 -->
  <g transform="translate(330 160)">
    <rect width="120" height="12" rx="6" fill="#e53935"/>
    <rect x="120" width="120" height="12" rx="6" fill="#fdd835"/>
  </g>

  <!-- 초코비 상자 -->
  <g transform="translate(730 120)">
    <g class="bounce">
      <rect width="86" height="64" rx="8" fill="#6d3b1f" stroke="#ffffff" stroke-width="3"/>
      <rect x="8" y="8" width="70" height="22" rx="4" fill="#fdd835"/>
      <text x="43" y="25" text-anchor="middle" class="t" font-size="15" font-weight="800" fill="#6d3b1f">초코비</text>
      <circle cx="26" cy="46" r="7" fill="#a0612f"/><circle cx="44" cy="48" r="7" fill="#a0612f"/><circle cx="62" cy="45" r="7" fill="#a0612f"/>
    </g>
  </g>

  <!-- 말풍선 -->
  <g class="pop" transform="translate(560 190)">
    <rect width="180" height="40" rx="20" fill="#ffffff" stroke="#e53935" stroke-width="2"/>
    <path d="M30 40 L24 54 L44 40 Z" fill="#ffffff" stroke="#e53935" stroke-width="2"/>
    <rect x="26" y="37" width="20" height="5" fill="#ffffff"/>
    <text x="90" y="26" text-anchor="middle" class="t" font-size="16" fill="#e53935">오늘도 커밋 출동~!</text>
  </g>
</svg>
